[project]
name = "unified-file-search-tool"
version = "0.1.0"
description = "指定ディレクトリ配下の各種ドキュメントを横断検索するデスクトップアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pypdf>=3.17.0",
    "pymupdf>=1.23.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]
