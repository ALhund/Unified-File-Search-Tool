[project]
name = "unified-file-search-tool"
version = "0.2.0"
description = "指定ディレクトリ配下の各種ドキュメントを横断検索するデスクトップアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6-essentials>=6.6.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pypdfium2>=4.30.0",
    "charset-normalizer>=3.3.0",
    "pillow>=10.0.0",
    "cryptography>=42.0.0",
    "xlrd>=2.0.1",
    "olefile>=0.47",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]
